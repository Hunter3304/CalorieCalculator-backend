# ???????????? application.properties ?
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:calorie_calculator}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema creation is explicit by default to avoid dropping local data on every start.
# Set SQL_INIT_MODE=always only when you intentionally want Spring to run schema.sql.
spring.sql.init.mode=${SQL_INIT_MODE:never}

# ????????????
mybatis.configuration.map-underscore-to-camel-case=true

server.port=${PORT:8080}

# WeChat Mini Program login. Secrets are injected only through the server environment.
wechat.app-id=${WECHAT_APP_ID:}
wechat.app-secret=${WECHAT_APP_SECRET:}
auth.session-days=${AUTH_SESSION_DAYS:30}